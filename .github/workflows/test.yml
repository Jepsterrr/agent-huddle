name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Agent Huddle is a Windows app: test where it runs.
    runs-on: windows-latest
    strategy:
      matrix:
        # The oldest Node that package.json allows, and a current one (which
        # also loads the plugin module's TypeScript for its register() tests).
        node: ['22.12', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The tests need no Electron binary; skip its 100 MB download.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
